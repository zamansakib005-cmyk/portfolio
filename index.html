}

/* image slot */
function slot(id,label,opt={}){
  const ratio = opt.ratio||'16/10', cls = opt.fit==='cover' ? '' : 'contain';
  return `<figure class="slot ${cls}" data-slot="${id}" ${opt.keep?'data-keep="1"':''} style="aspect-ratio:${ratio};margin:0">
    <img alt="${esc(opt.alt||label)}" loading="lazy" hidden>
    <div class="ph">${opt.initials?`<div class="init">${opt.initials}</div>`:IC.img}<div>${esc(label)}</div></div>
    ${EDIT?`<span class="slot-id">${id}</span><div class="slot-ui"><button type="button" data-a="up">Upload</button><button type="button" data-a="adj">Position / crop</button><button type="button" data-a="rm">Remove</button><input type="file" accept="image/*" hidden></div>`:''}
  </figure>`;
}

/* idb for uploaded files (edit mode preview) */
const idb = {
  db:null,
  open(){ return new Promise((res,rej)=>{ if(this.db) return res(this.db); try{ const r=indexedDB.open('sakib_portfolio',1); r.onupgradeneeded=()=>r.result.createObjectStore('f'); r.onsuccess=()=>{this.db=r.result;res(this.db)}; r.onerror=()=>rej(r.error);}catch(e){rej(e)} }); },
  async get(k){ const d=await this.open(); return new Promise(res=>{ const q=d.transaction('f').objectStore('f').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined); }); },
  async set(k,v){ const d=await this.open(); return new Promise((res,rej)=>{ const q=d.transaction('f','readwrite').objectStore('f').put(v,k); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); }); },
  async del(k){ const d=await this.open(); return new Promise(res=>{ const q=d.transaction('f','readwrite').objectStore('f').delete(k); q.onsuccess=()=>res(); q.onerror=()=>res(); }); }
};

async function hydrateSlot(el){
  const id = el.dataset.slot, img = el.querySelector('img'), ph = el.querySelector('.ph');
  let src = PUBLISHED.images[id] || CONFIG.images[id] || '';
  if(EDIT){ try{ const b = await idb.get('img:'+id); if(b){ if(el._url) URL.revokeObjectURL(el._url); el._url = URL.createObjectURL(b); src = el._url; } }catch(e){} }
  if(src){
    img.onerror = ()=>{ img.hidden=true; ph.hidden=false; if(!EDIT && !el.dataset.keep) el.hidden=true; };
    img.src = src; img.hidden=false; ph.hidden=true;
    const c = store.crops[id]||{x:50,y:50,z:1};
    img.style.objectPosition = `${c.x}% ${c.y}%`; img.style.transform = `scale(${c.z})`;
  } else {
    img.hidden = true; ph.hidden = false; img.removeAttribute('src');
    if(!EDIT && !el.dataset.keep) el.hidden = true;
  }
}
function bindSlot(el){
  if(!EDIT) return;
  const id = el.dataset.slot, input = el.querySelector('input[type=file]');
  el.querySelector('[data-a=up]').onclick = ()=>input.click();
  input.onchange = async ()=>{ const f=input.files[0]; if(!f) return; try{ await idb.set('img:'+id,f); }catch(e){ alert('Could not store the image in this browser.'); } hydrateSlot(el); };
  el.querySelector('[data-a=rm]').onclick = async ()=>{ try{ await idb.del('img:'+id);}catch(e){} delete store.crops[id]; persist(); hydrateSlot(el); };
  el.querySelector('[data-a=adj]').onclick = ()=>{
    let p = el.querySelector('.slot-adj'); if(p){ p.remove(); return; }
    const c = store.crops[id]||{x:50,y:50,z:1};
    p = document.createElement('div'); p.className='slot-adj';
    p.innerHTML = `<label>Left–right<input type="range" min="0" max="100" value="${c.x}" data-p="x"></label><label>Up–down<input type="range" min="0" max="100" value="${c.y}" data-p="y"></label><label>Zoom<input type="range" min="100" max="250" value="${c.z*100}" data-p="z"></label>`;
    el.appendChild(p);
    p.querySelectorAll('input').forEach(r=>r.oninput=()=>{
      const cur = store.crops[id]||{x:50,y:50,z:1}; const v = +r.value; cur[r.dataset.p] = r.dataset.p==='z' ? v/100 : v; store.crops[id]=cur; persist();
      const im = el.querySelector('img'); im.style.objectPosition=`${cur.x}% ${cur.y}%`; im.style.transform=`scale(${cur.z})`;
    });
  };
}

async function hydrateLogo(el){
  const id=el.dataset.logo, img=el.querySelector('.tl img'), ic=el.querySelector('.tl .ico');
  let src=PUBLISHED.images[id]||CONFIG.images[id]||'';
  if(EDIT){ try{ const b=await idb.get('img:'+id); if(b){ if(el._url) URL.revokeObjectURL(el._url); el._url=URL.createObjectURL(b); src=el._url; } }catch(e){} }
  if(src){ img.onerror=()=>{ img.hidden=true; ic.hidden=false; }; img.src=src; img.hidden=false; ic.hidden=true; }
  else { img.hidden=true; img.removeAttribute('src'); ic.hidden=false; }
}

    ${head?`<div class="proj-metrics">${head}</div>`:''}
    <details><summary>Project details ${IC.chev}</summary><div class="detail">
      <dl class="dl">
        <dt>Objective</dt><dd>${tx(k+'.obj',p.objective)}</dd>
        ${show(k+'.role',p.role)?`<dt>My role</dt><dd>${tx(k+'.role',p.role)}</dd>`:''}
        <dt>Platforms</dt><dd>${tx(k+'.pl',p.platforms,'')||'—'}</dd>
        ${show(k+'.dur',p.duration)?`<dt>Duration</dt><dd>${tx(k+'.dur',p.duration)}</dd>`:''}
      </dl>
      ${list(p.strategy,k+'.st')?`<div><b>Campaign strategy</b>${list(p.strategy,k+'.st')}</div>`:''}
      ${list(p.execution,k+'.ex')?`<div><b>Execution</b>${list(p.execution,k+'.ex')}</div>`:''}
      ${rows?`<div><b>Results</b><dl class="dl" style="margin-top:8px">${rows}</dl>${p.resNote?`<p class="note">${esc(p.resNote)}</p>`:''}</div>`:''}
      <div class="shots">${p.shots.map((s,si)=>slot(`${p.id}-${'ab'[si]}`,s,{ratio:'16/10',alt:`${p.title}: ${s}`})).join('')}</div>
    </div></details></article>`; }).join('')}</div></div></section>`; }

function dashboard(){
  const groups=[['Paid campaigns','Meta Ads and Google Ads'],['Organic and paid reach','Social media and ad campaigns combined'],['Organic audience','Across social channels']];
  const t = CONFIG.chartData;
  const mx = Math.max(1,...t.items.map(d=>d.value));
  const body = groups.map(([g,sub],gi)=>{
    const cards = CONFIG.metrics.map((m,i)=>({m,i})).filter(({m,i})=>m[4]===gi && (EDIT||!isPh(val(`m${i}.v`,m[1]))));
    if(!cards.length) return '';
    return `<div class="dgroup"><h3>${g}<small>${sub}</small></h3><div class="dash">${cards.map(({m,i})=>{const k='m'+i; return `<div class="metric rv"><div class="n">${tx(k+'.v',m[1])}</div><div class="l">${tx(k+'.n',m[0])}</div>
    <div class="p">${tx(k+'.p',m[2],'Reporting period not specified')}<em>${tx(k+'.s',m[3],'')}</em></div></div>`; }).join('')}</div></div>`;
  }).join('');
  return `<section id="dashboard" class="alt"><div class="wrap">${secHead('Results','Campaign performance dashboard','Each figure carries its own reporting period and source, and organic and paid results are shown separately where they are separate.')}
  ${body}
  ${t.items.length?`<div class="chart card"><b>${esc(t.title)}</b>${t.items.map(d=>`<div class="row"><span>${esc(d.label)}</span><i style="width:${d.value/mx*100}%"></i><b>${d.value.toLocaleString()}</b></div>`).join('')}</div>`:''}
  </div></section>`; }

function achievements(){ const items=CONFIG.achievements.map((a,i)=>({a,i})).filter(({a,i})=>EDIT||!isPh(val(`a${i}.n`,a.name)));
  return `<section id="achievements"><div class="wrap">${secHead('Recognition','Achievements')}
  <div class="grid">${items.map(({a,i})=>{const k='a'+i; return `<div class="card ach rv"><div><div class="yr">${tx(k+'.y',a.year)}</div></div><div><h3 style="margin-bottom:4px">${tx(k+'.n',a.name)}</h3><div style="color:var(--blue);font-weight:600;margin-bottom:8px">${tx(k+'.o',a.org)}</div>${show(k+'.d',a.desc)?`<p style="margin:0 0 12px;color:#374151">${tx(k+'.d',a.desc)}</p>`:''}<div style="max-width:300px">${slot('ach-'+i,'Award or certificate image',{ratio:a.ratio||'4/3',fit:a.fit,alt:a.name})}</div></div></div>`; }).join('')}</div></div></section>`; }

const TI={
  ads:svg('<path d="M3 11v3a1 1 0 001 1h2l5 4V6L6 10H4a1 1 0 00-1 1z"/><path d="M15 9a4 4 0 010 6M18 6.5a8 8 0 010 11"/>'),
  analytics:svg('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  design:svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>'),
  video:svg('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/>'),
  ai:svg('<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>'),
  chat:svg('<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/>')
};
function toolsSec(){ return `<section id="tools" class="alt"><div class="wrap">${secHead('Toolkit','Tools and platforms')}<div class="tools rv">${CONFIG.tools.map(([n,c],i)=>`<div class="tool" data-logo="tool-${i}"><span class="tl"><img alt="${esc(n)} logo" hidden>${TI[c]||TI.ads}</span>${tx('tool.'+i,n)}${EDIT?`<span class="tl-ui"><button type="button" data-a="up">Logo</button><button type="button" data-a="rm" aria-label="Remove logo">×</button><input type="file" accept="image/*" hidden></span>`:''}</div>`).join('')}</div>${EDIT?"<p class=\"note\">Edit mode: use each tool's Logo button to upload its official logo (from the brand's own press or brand page). Until then a neutral icon is shown.</p>":''}</div></section>`; }

function education(){ return `<section id="education"><div class="wrap">${secHead('Education','Education')}
  <div class="grid">${CONFIG.education.map((e,i)=>{const k='ed'+i; return `<div class="card rv"><h3>${tx(k+'.d',e.degree)}</h3><p style="margin:0"><b>${tx(k+'.m',e.major)}</b></p><p style="margin:4px 0;color:var(--blue);font-weight:600">${tx(k+'.s',e.school)}</p>${show(k+'.y',e.year)?`<p style="margin:0;color:var(--mute)">${tx(k+'.y',e.year)}</p>`:''}<p style="margin:0;color:var(--mute)">${tx(k+'.c',e.cgpa)}</p></div>`; }).join('')}</div></div></section>`; }

function certs(){ const it=CONFIG.certifications.map((c,i)=>({c,i})).filter(({c,i})=>EDIT||!isPh(val(`k${i}.t`,c.title)));
  if(!it.length) return '';
  return `<section id="certifications" class="alt"><div class="wrap">${secHead('Credentials','Certifications')}
  <div class="grid">${it.map(({c,i})=>{const k='k'+i; return `<div class="card rv"><h3>${tx(k+'.t',c.title)}</h3><p style="margin:0;color:var(--blue);font-weight:600">${tx(k+'.o',c.org)}</p><p style="margin:4px 0 12px;color:var(--mute)">${tx(k+'.d',c.date)}</p>${slot('cert-'+i,'Certificate image',{ratio:'4/3'})}${c.link?`<p style="margin:12px 0 0"><a href="${esc(c.link)}" target="_blank" rel="noopener">Verify certificate</a></p>`:''}</div>`; }).join('')}</div></div></section>`; }

function testimonials(){ const it=CONFIG.testimonials.map((c,i)=>({c,i})).filter(({c,i})=>EDIT||!isPh(val(`te${i}.t`,c.text)));
  if(!it.length) return '';
  return `<section id="testimonials"><div class="wrap">${secHead('Kind words','Testimonials')}
  <div class="grid">${it.map(({c,i})=>{const k='te'+i; return `<figure class="card quote rv" style="margin:0"><blockquote style="margin:0">${tx(k+'.t',c.text)}</blockquote><cite>${tx(k+'.w',c.who)}</cite>${slot('te-'+i,'Testimonial image',{ratio:'16/9'})}</figure>`; }).join('')}</div></div></section>`; }

function contact(){ const L=links(); const rn = store.settings.resumeName; return `<section id="contact" class="alt"><div class="wrap contact-grid">
  <div class="rv">${secHead('Contact','Let\'s work together','Open to marketing roles, agency work and professional connections.')}
   <div class="cl">
    ${L.mail?`<a href="${esc(L.mail)}">${IC.mail}${esc(L.e)}</a>`:(EDIT?`<div>${IC.mail}<span class="ph-text">Email not set (use Contact &amp; links)</span></div>`:'')}
    ${L.li?`<a href="${esc(L.li)}" target="_blank" rel="noopener">${IC.in}LinkedIn profile</a>`:(EDIT?`<div>${IC.in}<span class="ph-text">LinkedIn not set</span></div>`:'')}
    ${L.p?`<a href="tel:${esc(L.p.replace(/[^+\d]/g,''))}">${IC.phone}${esc(L.p)}</a>`:(EDIT?`<div>${IC.phone}<span class="ph-text">Phone not set (optional)</span></div>`:'')}
    ${CONFIG.contact.location?`<div>${IC.pin}${esc(CONFIG.contact.location)}</div>`:''}
   </div>
   <div class="cta"><a class="btn js-resume-view" href="${CONFIG.resume.path}" target="_blank" rel="noopener">${IC.eye} View Resume</a><a class="btn ghost js-resume-dl" href="${CONFIG.resume.path}" download="${CONFIG.resume.downloadName}">${IC.dl} Download Resume</a></div>
   ${EDIT?`<p class="note">Resume file in this browser: <b>${esc(rn||'none uploaded (using '+CONFIG.resume.path+')')}</b></p>`:''}
  </div>
  <form class="f card rv" id="cform" novalidate>
   <div class="two"><label>Name<input name="name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label></div>
   <label>Subject<input name="subject" required></label>
   <label>Message<textarea name="message" rows="5" required></textarea></label>
   <button class="btn" type="submit">Send message ${IC.arrow}</button>
   <p id="formMsg" role="status" aria-live="polite"></p>
  </form></div></section>`; }

function footer(){ const L=links(); return `<footer><div class="wrap"><div class="fg"><div><b>Md Tuhuruzzaman</b><div>Digital Marketing Specialist</div></div>
  <nav aria-label="Footer">${L.li?`<a href="${esc(L.li)}" target="_blank" rel="noopener">LinkedIn</a>`:''}${L.mail?`<a href="${esc(L.mail)}">Email</a>`:''}<a class="js-resume-view" href="${CONFIG.resume.path}" target="_blank" rel="noopener">Resume</a></nav></div>
  <div class="copy"><span>© <span id="yr"></span> Md Tuhuruzzaman. All rights reserved.</span><a href="?edit" rel="nofollow">Owner edit mode</a></div></div></footer>`; }

function editTool(){ return EDIT?`<aside id="etool" aria-label="Edit mode tools"><b>Edit mode</b><p>Click any dashed text to edit. Edits save in this browser. Use Export edits to publish them.</p>
  <button id="eContact">Contact &amp; links</button><label class="b">Upload CV PDF<input id="eCv" type="file" accept="application/pdf" hidden></label>
  <button id="eExport">Export edits (JSON)</button><button id="eReset">Reset local edits</button><button id="eExit">Exit edit mode</button></aside>
  <dialog id="dlg"><form method="dialog" id="dform"><h3 style="margin-bottom:14px">Contact &amp; links</h3>
   <label>Professional email<input name="email" type="email" value="${esc(setting('email'))}"></label>
   <label>LinkedIn URL<input name="linkedin" value="${esc(setting('linkedin'))}"></label>
   <label>Phone (optional)<input name="phone" value="${esc(setting('phone'))}"></label>
   <label>Form endpoint (optional)<small>A Formspree/Getform style URL. If empty, the form opens the visitor's email app addressed to you.</small><input name="formEndpoint" value="${esc(setting('formEndpoint'))}"></label>
   <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost sm" value="cancel">Cancel</button><button class="btn sm" value="save" id="dsave">Save</button></div></form></dialog>`:''; }

function render(){
  document.getElementById('app').innerHTML = nav()+'<main>'+hero()+about()+skills()+experience()+projects()+dashboard()+achievements()+toolsSec()+education()+certs()+testimonials()+contact()+'</main>'+footer()+editTool();
  document.body.classList.toggle('edit',EDIT);
  document.getElementById('yr').textContent = new Date().getFullYear();
  post();
}

function post(){
  // nav
  const burger=document.querySelector('.burger'), menu=document.getElementById('menu');
  burger.onclick=()=>{ const o=menu.classList.toggle('open'); burger.setAttribute('aria-expanded',o); };
  menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{ menu.classList.remove('open'); burger.setAttribute('aria-expanded','false'); }));
  // slots
  document.querySelectorAll('.slot').forEach(el=>{ bindSlot(el); hydrateSlot(el); });
  document.querySelectorAll('.tool[data-logo]').forEach(el=>{ bindLogo(el); hydrateLogo(el); });
  // resume
  initResume();
  // edit text
  if(EDIT) document.querySelectorAll('[data-k]').forEach(el=>{
    el.contentEditable = 'true'; el.spellcheck = false;
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
    el.addEventListener('blur',()=>{ const t=el.textContent.trim(); if(t!==(store.text[el.dataset.k]??'')){ store.text[el.dataset.k]=t; persist(); el.classList.toggle('ph-text',isPh(t)); } });
  });
  // reveal + active nav
  const rv=document.querySelectorAll('.rv');
  if('IntersectionObserver' in window){ const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }),{threshold:.08}); rv.forEach(r=>io.observe(r)); }
  else rv.forEach(r=>r.classList.add('in'));
  if('IntersectionObserver' in window){ const links=[...document.querySelectorAll('#menu a[href^="#"]')]; const so=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ links.forEach(l=>l.classList.toggle('active',l.getAttribute('href')==='#'+e.target.id)); } }),{rootMargin:'-40% 0px -55% 0px'}); document.querySelectorAll('main section[id]').forEach(s=>so.observe(s)); }
  // form
  document.getElementById('cform').onsubmit = submitForm;
  // edit tools
  if(EDIT) bindEdit();
}

async function initResume(){
  let url = CONFIG.resume.path;
  try{ const b = EDIT ? await idb.get('resume') : null; if(b) url = URL.createObjectURL(b); }catch(e){}
  document.querySelectorAll('.js-resume-view').forEach(a=>a.href=url);
  document.querySelectorAll('.js-resume-dl').forEach(a=>{ a.href=url; a.setAttribute('download',CONFIG.resume.downloadName); });
}

async function submitForm(e){
  e.preventDefault();
  const f=e.target, msg=document.getElementById('formMsg'), d=Object.fromEntries(new FormData(f));
  if(!f.checkValidity()){ msg.style.color='#b91c1c'; msg.textContent='Please complete every field with a valid email address.'; f.reportValidity(); return; }
  const ep=setting('formEndpoint'), to=setting('email');
  if(ep){
    msg.style.color='var(--mute)'; msg.textContent='Sending…';
    try{ const r=await fetch(ep,{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify(d)}); if(!r.ok) throw 0; f.reset(); msg.style.color='#047857'; msg.textContent='Thanks, your message was sent.'; }
    catch(_){ msg.style.color='#b91c1c'; msg.textContent='Sending failed. Please email me directly'+(to?` at ${to}`:'')+'.'; }
  } else if(to){
    location.href=`mailto:${to}?subject=${encodeURIComponent(d.subject)}&body=${encodeURIComponent(d.message+'\n\n— '+d.name+' ('+d.email+')')}`;
    msg.style.color='var(--mute)'; msg.textContent='Your email app should open with the message ready to send.';
  } else { msg.style.color='#b45309'; msg.textContent='This form is not connected yet: the site owner has not added a contact email.'; }
}

function bindEdit(){
  const dlg=document.getElementById('dlg');
  document.getElementById('eContact').onclick=()=>dlg.showModal();
  document.getElementById('dform').addEventListener('submit',e=>{
    if(e.submitter && e.submitter.value==='save'){ const d=Object.fromEntries(new FormData(e.target)); Object.assign(store.settings,{email:d.email.trim(),linkedin:d.linkedin.trim(),phone:d.phone.trim(),formEndpoint:d.formEndpoint.trim()}); persist(); setTimeout(render,0); }
  });
  document.getElementById('eCv').onchange=async ev=>{ const f=ev.target.files[0]; if(!f) return; if(f.type!=='application/pdf'){ alert('Please choose a PDF file.'); return; }
    try{ await idb.set('resume',f); store.settings.resumeName=f.name; persist(); render(); alert('CV loaded for preview in this browser. To publish it, save the file as assets/'+CONFIG.resume.downloadName+' next to index.html.'); }catch(e){ alert('Could not store the PDF in this browser.'); } };
  document.getElementById('eExport').onclick=()=>{ const out={text:store.text,settings:Object.assign({},store.settings),crops:store.crops,images:PUBLISHED.images}; delete out.settings.resumeName; const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'})); a.download='portfolio-edits.json'; a.click(); };
  document.getElementById('eReset').onclick=async()=>{ if(!confirm('Remove all edits, uploaded images and the CV preview stored in this browser?')) return; try{ localStorage.removeItem(LS); const d=await idb.open(); d.transaction('f','readwrite').objectStore('f').clear(); }catch(e){} location.reload(); };
  document.getElementById('eExit').onclick=()=>{ location.href=location.pathname; };
}

render();
</script>
